[workspace]
resolver = "2"
members = [
    "apps/fleet",
    "apps/fleet-cli",
    "crates/arma3",
    "crates/core",
    "crates/domain",
    "crates/download",
    "crates/inventory",
    "crates/manifest",
    "crates/pipeline",
    "crates/reconcile",
    "crates/swifty-repo",
]

[workspace.package]
license = "GPL-3.0-only"

[workspace.dependencies]
# Workspace crates (path deps)
fleet-cli                = { path = "apps/fleet-cli" }
fleet-core               = { path = "crates/core" }
fleet-download           = { path = "crates/download" }
fleet-domain             = { path = "crates/domain" }
fleet-inventory          = { path = "crates/inventory" }
fleet-manifest           = { path = "crates/manifest" }
fleet-pipeline           = { path = "crates/pipeline" }
fleet-reconcile          = { path = "crates/reconcile" }
fleet                    = { path = "apps/fleet" }
swifty-repo              = { path = "crates/swifty-repo" }
fleet-arma3              = { path = "crates/arma3" }

# Local dependencies
swifty_artifacts       = { git = "https://github.com/tyen901/swifty-artifacts.git", tag = "v1.1.0" }

# Local dependencies (Flux)
flux-api                    = { path = "../flux/crates/api", package = "flux-api" }
flux-inventory-contract     = { path = "../flux/crates/inventory-contract", package = "flux-inventory-contract" }
flux-manifest               = { path = "../flux/crates/manifest", package = "flux-manifest" }
flux-segment-cache          = { path = "../flux/crates/segment-cache", package = "flux-segment-cache" }
flux-types                  = { path = "../flux/crates/types", package = "flux-types" }

# Async runtime, HTTP, and server framework
tokio        = { version = "1.49.0", features = ["full"] }
tokio-util   = { version = "0.7.18", features = ["io-util"] }
hyper        = "1.8.1"
reqwest      = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
axum         = { version = "0.8.8", default-features = false, features = ["tokio", "http1"] }
async-trait  = "0.1.89"
futures      = "0.3.31"
futures-util = "0.3.31"
tower        = { version = "0.5.2", features = ["util"] }

# Serialization
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
specta     = { version = "=2.0.0-rc.22", features = ["derive"] }

# Logging / diagnostics
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "time"] }
tracing-appender   = "0.2.4"
sentry             = "0.46.1"

# CLI
clap = { version = "4.5.55", features = ["derive"] }

# Error handling
anyhow      = "1.0.100"
thiserror   = "2.0.18"
rand        = "0.8"

# Identifiers / parsing / encoding
uuid              = { version = "1.20.0", features = ["v4"] }
hex               = "0.4.3"
percent-encoding  = "2.3.2"
shell-words       = "1.1.1"
shlex             = "1.3.0"
regex             = "1.12.2"
url               = "2.5.8"
velopack          = "0.0.1369-g1d5c984"

# Bytes / paths
bytes     = "1.11.1"
byteorder = "1.5.0"
camino    = "1.2.2"

# Hashing
blake3 = "1.8.2"
md5  = "0.8.0"   # repo checksum compatibility
sha1 = "0.10.6"  # Swifty repo checksum
sha2 = "0.10.9"  # SHA-256 for InstallationId

# Concurrency
rayon             = "1.11.0"
crossbeam-channel = "0.5.15"

# Filesystem / OS
walkdir      = "2.5.0"
directories  = "6.0.0"
filetime     = "0.2.27"
tempfile     = "3.24.0"
winreg       = "0.55.0"
fs2          = "0.4.3"

# Database
rusqlite = "0.38.0"

# Time
chrono = "0.4.43"

# Rate limiting / numeric helpers
governor   = "0.10.4"
nonzero_ext = "0.3.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
#strip = "symbols"
debug = 0
