[workspace]
resolver = "2"
members = [
  "crates/fleet_app",
  "crates/fleet_fs",
  "crates/fleet_index",
  "crates/fleet_remote_http",
  "crates/fleet_scan",
  "crates/fleet_swifty_wire",
  "crates/fleet_manifest_domain",
  "crates/fleet_sync",
  "apps/fleet",
]

[workspace.metadata.docs.rs]
all-features = true

[workspace.dependencies]
# Internal crates
fleet_app = { path = "crates/fleet_app" }
fleet_fs = { path = "crates/fleet_fs" }
fleet_index = { path = "crates/fleet_index" }
fleet_remote_http = { path = "crates/fleet_remote_http" }
fleet_scan = { path = "crates/fleet_scan" }
fleet_sync = { path = "crates/fleet_sync" }
fleet_swifty_wire = { path = "crates/fleet_swifty_wire" }
fleet_manifest_domain = { path = "crates/fleet_manifest_domain" }

# External dependencies
anyhow = "1.0"
async-trait = "0.1"
camino = "1.1"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
eframe = "0.33.3"
egui = "0.33.3"
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.43", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
] }
tokio-util = "0.7"
tracing = "0.1"
velopack = "0.0.1298"
walkdir = "2"
percent-encoding = "2.3"
open = "5.3"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
relative-path = "1.9"
md5 = "0.7"
url = "2"
rusqlite = { version = "0.30", features = ["bundled"] }
blake3 = "1"
hex = "0.4"
rfd = "0.15"
md-5 = "0.10"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
assert_cmd = "2.0"

atomicwrites = "0.4"
fs2 = "0.4"
shell-escape = "0.1"
shell-words = "1"
