[package]
name = "sync_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
walkdir = "2"
blake3 = "1"
async-trait = "0.1"
thiserror = "1"
fleet_fs_case = { path = "../fleet_fs_case" }

[dev-dependencies]
tempfile = "3"
fleet_index = { path = "../fleet_index" }
