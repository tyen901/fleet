[package]
name = "fleet-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["flux"]
flux = ["dep:fleet-flux", "dep:fleet-inventory"]

[dependencies]
anyhow = { workspace = true }
fleet-download = { workspace = true }
fleet-domain = { workspace = true }
fleet-inventory = { workspace = true, optional = true }
fleet-flux = { workspace = true, optional = true }
swifty-repo = { workspace = true }
directories = { workspace = true }
fleet-arma3 = { workspace = true }
shell-words = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
