[package]
name = "remote_http"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
async-trait = "0.1"
futures-util = "0.3"
manifest_types = { path = "../manifest_types" }
remote_core = { path = "../remote_core" }
relative-path = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1.0"
hex = "0.4"
url = "2"

[dev-dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
