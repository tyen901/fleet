[package]
name = "fleet_app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
camino = "1.1"
directories = "5.0"
open = "5.3"
percent-encoding = "2.3"
fleet_remote_http = { path = "../fleet_remote_http" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fleet_sync = { path = "../fleet_sync" }
fleet_index = { path = "../fleet_index" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
walkdir = "2.5"
md5 = "0.7"

# New: error ergonomics + safe registry writes + file locking
thiserror = "2"
atomicwrites = "0.4"
fs2 = "0.4"
async-trait = "0.1.89"
