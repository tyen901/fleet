[package]
name = "fleet_app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
camino = { workspace = true }
directories = { workspace = true }
open = "5.3"
percent-encoding = { workspace = true }
shell-escape = { workspace = true }
shell-words = { workspace = true }
fleet_remote_http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fleet_sync = { workspace = true }
fleet_index = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# Required for clipboard interactions in the data service.  Although
# `fleet_app` is primarily a backend crate, it exposes a method to copy
# launch arguments to the clipboard via an `egui` context.  Declare
# `egui` as a workspace dependency so that the data service can accept an
# `&egui::Context` parameter without requiring consumers to pull in
# `egui` themselves.
egui = { workspace = true }

md5 = "0.7"

# New: error ergonomics + safe registry writes + file locking
thiserror = { workspace = true }
atomicwrites = "0.4"
fs2 = "0.4"
async-trait = { workspace = true }
uuid = { version = "1.19.0", features = ["v4"] }

# Required for the update service.  Velopack provides facilities for
# checking, downloading and applying application updates.
velopack = { workspace = true }
