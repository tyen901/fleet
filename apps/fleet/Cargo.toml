[package]
name = "fleet"
version = "0.1.0"
edition = "2021"
default-run = "fleet"

[lib]
name = "fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
velopack = { workspace = true }
serde_json = { workspace = true }
# Internal crates
fleet_app = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tempfile = "3"
urlencoding = "2"
walkdir = "2"
serde = { workspace = true }
fleet_swifty_wire = { workspace = true }

[[bin]]
name = "fleet"
path = "src/main.rs"
