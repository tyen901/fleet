[package]
name = "fleet"
version = "4.0.0-beta.2"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
dotenvy = "0.15.7"
open = "5.3.3"
rfd = "0.17.2"
directories = { workspace = true }
icondata = { version = "0.7.0", default-features = false, features = ["bootstrap-icons"] }

fleet-core = { workspace = true }
fleet-domain = { workspace = true }
swifty-repo = { workspace = true }
velopack = { workspace = true }
semver = "1.0.27"
base64 = "0.22.1"
image = { version = "0.25.6", default-features = false, features = ["png"] }

# Dioxus
dioxus = { version = "0.7.9", features = ["desktop", "router"] }
dioxus-router = "0.7.9"
tracing = { workspace = true }
