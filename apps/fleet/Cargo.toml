[package]
name = "fleet"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
camino = "1.1"
fleet_app = { path = "../../crates/fleet_app" }
fleet-ui = { path = "../../crates/fleet_ui" }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
velopack = "0.0.1298"

[dev-dependencies]
assert_cmd = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
urlencoding = "2"
walkdir = "2"
