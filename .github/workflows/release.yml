name: Deploy to GitHub Releases (Velopack)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy-to-github-releases:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute Version
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          ver="${ref#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        shell: bash
        env:
          # Compiled into the binary via option_env!("FLEET_UPDATE_URL")
          # This is the base URL; Velopack HttpSource fetches {baseUrl}/RELEASES
          FLEET_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          cargo build --release -p fleet

      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Download previous releases (for deltas)
        shell: bash
        run: |
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack release
        shell: bash
        run: |
          vpk pack -u fleet -v ${{ steps.ver.outputs.version }} -p target/release -e fleet.exe

      - name: Upload release to GitHub
        shell: bash
        run: |
          vpk upload github \
            --repoUrl https://github.com/${{ github.repository }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --publish \
            --releaseName "Fleet ${{ steps.ver.outputs.version }}" \
            --tag v${{ steps.ver.outputs.version }}

