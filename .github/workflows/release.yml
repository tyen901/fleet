name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build + Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            app_id: fleet
            exe_name: fleet.exe
            channel: win-stable
          - target: linux
            os: ubuntu-24.04
            app_id: fleet
            exe_name: fleet
            channel: linux-stable

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and Package
        id: build
        uses: ./.github/actions/build-and-package
        with:
          target: ${{ matrix.target }}
          app_id: ${{ matrix.app_id }}
          exe_name: ${{ matrix.exe_name }}
          channel: ${{ matrix.channel }}
          private_deps_token: ${{ secrets.FLEET_PRIVATE_DEPS_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: releases-${{ matrix.target }}
          path: Releases
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: releases-*
          path: Releases
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            Releases/fleet-*.nupkg
            Releases/fleet-*.zip
            Releases/fleet-*.exe
            Releases/fleet-*.AppImage
            Releases/RELEASES*
            Releases/releases.win-*.json
            Releases/releases.linux-*.json
            Releases/assets.win-*.json
            Releases/assets.linux-*.json
          fail_on_unmatched_files: true
