name: Dev Release

on:
  push:
    tags:
      - "dev/v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build + Package (dev/${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            app_id: fleet
            exe_name: fleet.exe
            channel: win-dev
          - target: linux
            os: ubuntu-24.04
            app_id: fleet
            exe_name: fleet
            channel: linux-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Package
        id: build
        uses: ./.github/actions/build-and-package
        with:
          target: ${{ matrix.target }}
          app_id: ${{ matrix.app_id }}
          exe_name: ${{ matrix.exe_name }}
          channel: ${{ matrix.channel }}
          private_deps_token: ${{ secrets.FLEET_PRIVATE_DEPS_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: releases-${{ matrix.target }}
          path: Releases
          if-no-files-found: error

  publish:
    name: Publish Dev Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: releases-*
          path: Releases
          merge-multiple: true

      - name: Upload dev release assets
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          overwrite_files: true
          files: |
            Releases/fleet-*.nupkg
            Releases/fleet-*.zip
            Releases/fleet-*.exe
            Releases/fleet-*.AppImage
            Releases/RELEASES*
            Releases/releases.win-*.json
            Releases/releases.linux-*.json
            Releases/assets.win-*.json
            Releases/assets.linux-*.json
          fail_on_unmatched_files: true
