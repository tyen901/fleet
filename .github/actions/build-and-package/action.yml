name: "Build and Package"
description: "Builds and packages the Fleet application"
inputs:
  target:
    description: "Target platform (windows, linux)"
    required: true
  app_id:
    description: "App ID for Velopack"
    required: true
  exe_name:
    description: "Executable name"
    required: true
  channel:
    description: "Velopack channel name"
    required: true
  private_deps_token:
    description: "Token for private dependencies"
    required: true

outputs:
  version:
    description: "Computed version number"
    value: ${{ steps.ver.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Authenticate git for private dependencies
      shell: bash
      env:
        FLEET_PRIVATE_DEPS_TOKEN: ${{ inputs.private_deps_token }}
      run: |
        set -euo pipefail
        if [ -n "${FLEET_PRIVATE_DEPS_TOKEN:-}" ]; then
          git config --global url."https://x-access-token:${FLEET_PRIVATE_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

    - name: Compute version
      id: ver
      shell: bash
      run: |
        set -euo pipefail
        RAW_TAG="${GITHUB_REF_NAME##*/}"
        VERSION="${RAW_TAG#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2.8.2

    - name: Install cargo-binstall
      uses: taiki-e/install-action@cargo-binstall

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Prepare Windows app icon
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade --quiet pillow
        python .github/scripts/make_windows_ico.py apps/fleet/assets/icon.png apps/fleet/assets/icon.ico

    - name: Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        FUSE_PKG="libfuse2"
        if ! apt-cache show libfuse2 >/dev/null 2>&1; then
          FUSE_PKG="libfuse2t64"
        fi
        sudo apt-get install -y --no-install-recommends \
          "${FUSE_PKG}" \
          libxdo-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          squashfs-tools

    - name: Install Dioxus CLI
      shell: bash
      run: |
        set -euo pipefail
        cargo binstall dioxus-cli --version 0.7.3 --no-confirm --force
        dx --version

    - name: dx build (Dioxus desktop)
      env:
        FLEET_VERSION: ${{ steps.ver.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        (cd apps/fleet && dx build --release)

    - name: Stage package directory
      shell: bash
      run: |
        set -euo pipefail
        rm -rf packdir
        mkdir -p packdir
        APP_DIR="target/dx/fleet/release/${{ inputs.target }}/app"
        if [ ! -d "${APP_DIR}" ]; then
          APP_DIR="$(find target/dx -maxdepth 8 -type d -path '*/release/*/app' | head -n 1)"
        fi
        test -d "${APP_DIR}"
        cp -R "${APP_DIR}/." packdir/
        test -f "packdir/${{ inputs.exe_name }}"

    - name: Assert CLI is not staged
      shell: bash
      run: |
        set -euo pipefail
        if find packdir -maxdepth 1 -type f -name 'fleet-cli*' | grep -q .; then
          echo "fleet-cli binary found in packdir; release packaging must include only the Fleet app."
          exit 1
        fi

    - name: Install .NET 8
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: 8.0.x

    - name: Install vpk
      shell: bash
      run: |
        dotnet tool update -g vpk
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Velopack pack
      shell: bash
      run: |
        ICON_ARG="apps/fleet/assets/icon.png"
        if [ "${{ runner.os }}" = "Windows" ]; then
          ICON_ARG="apps/fleet/assets/icon.ico"
        fi
        vpk pack -u "${{ inputs.app_id }}" -v "${{ steps.ver.outputs.version }}" -p packdir -e "${{ inputs.exe_name }}" -i "$ICON_ARG" --channel "${{ inputs.channel }}"

    - name: Normalize asset names
      shell: bash
      run: |
        set -euo pipefail
        python .github/scripts/normalize_releases.py
      env:
        VERSION: ${{ steps.ver.outputs.version }}
        TARGET: ${{ inputs.target }}
        CHANNEL: ${{ inputs.channel }}

    - name: Assert CLI is not in release artifacts
      shell: bash
      run: |
        set -euo pipefail
        if find Releases -maxdepth 1 -type f -name '*fleet-cli*' | grep -q .; then
          echo "fleet-cli artifact found in Releases; release must include only Fleet app assets."
          exit 1
        fi
